<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ally & Alex">
<title>Ally &amp; Alex</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💍%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Karla:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="gate" hidden>
  <div class="gate-card">
    <div class="gate-title">Ally <span class="amp">&amp;</span> Alex</div>
    <div class="gate-sub">October 10, 2026 · McGill Rose Garden</div>
    <form id="gateForm" autocomplete="off">
      <label class="gate-label" for="passcode">Passcode</label>
      <input id="passcode" type="password" inputmode="text" autocapitalize="none" placeholder="the one Alex told you" required>
      <label class="gate-label">I am</label>
      <div class="who-row">
        <button type="button" class="who-btn" data-who="Ally">Ally</button>
        <button type="button" class="who-btn" data-who="Alex">Alex</button>
      </div>
      <button type="submit" class="gate-go" disabled>Open the planner</button>
      <div id="gateErr" class="gate-err" hidden></div>
    </form>
  </div>
</div>

<div id="shell" hidden>
  <header id="top">
    <a class="brand" href="#home"><span class="brand-name">Ally <span class="amp">&amp;</span> Alex</span></a>
    <div class="countdown" id="countdown"></div>
    <div class="spacer"></div>
    <div class="status" id="syncStatus" title="Sync status"></div>
    <button class="who-chip" id="whoChip" type="button" title="Switch who you are"></button>
  </header>
  <nav id="nav">
    <a href="#home" data-tab="home">Home</a>
    <a href="#planner" data-tab="planner">Planner</a>
    <a href="#seating" data-tab="seating">Seating</a>
    <a href="#music" data-tab="music">Music</a>
    <a href="#guests" data-tab="guests">Guests</a>
    <a href="#budget" data-tab="budget">Budget</a>
    <a href="#timeline" data-tab="timeline">Timeline</a>
    <a href="#vendors" data-tab="vendors">Vendors</a>
    <a href="#ceremony" data-tab="ceremony">Ceremony</a>
    <a href="#honeymoon" data-tab="honeymoon">Honeymoon</a>
  </nav>
  <div id="banner" hidden></div>
  <main id="view"></main>
</div>

<div id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
